# Fase 14 (CLAUDE.md) -- builda/sobe o Worker de Cloudflare Containers do
# servico fonetico direto de um runner ubuntu-latest (amd64 nativo, sem
# emulacao QEMU -- diferente de buildar num Mac arm64, que trava minutos no
# download/carregamento dos modelos wav2vec2/faster-whisper sob emulacao).
name: Deploy phonetic service

on:
  push:
    branches: [main]
    paths:
      - "services/phonetic-container/**"
      # mesmo achado do deploy-generation-service.yml (Fase 15): mudança em
      # código VENDORIZADO de pipeline/ não disparava redeploy sozinha.
      - "pipeline/src/deutsch_pipeline/**"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/phonetic-container
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      # docker COPY nao alcanca fora do build context -- vendoriza o
      # minimo necessario de pipeline/ pra dentro deste diretorio antes de
      # buildar (ver prepare-vendor.sh).
      - run: ./prepare-vendor.sh

      - name: Deploy with first valid Cloudflare token
        env:
          # Try both secret names in sequence because one can become stale or
          # lose Containers permissions independently.
          DEPLOY_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN }}
          LEGACY_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail

          try_deploy() {
            local token="$1"
            local label="$2"
            if [ -z "$token" ]; then
              return 1
            fi
            echo "Attempting deploy with ${label}..."
            if CLOUDFLARE_API_TOKEN="$token" npx wrangler deploy; then
              echo "Deploy succeeded with ${label}."
              return 0
            fi
            return 1
          }

          if try_deploy "$DEPLOY_TOKEN" "CLOUDFLARE_DEPLOY_API_TOKEN"; then
            exit 0
          fi

          if try_deploy "$LEGACY_TOKEN" "CLOUDFLARE_API_TOKEN"; then
            exit 0
          fi

          echo "Deploy failed with both configured Cloudflare tokens."
          exit 1
