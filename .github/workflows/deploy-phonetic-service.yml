# Fase 14 (CLAUDE.md) -- builda/sobe o Worker de Cloudflare Containers do
# servico fonetico direto de um runner ubuntu-latest (amd64 nativo, sem
# emulacao QEMU -- diferente de buildar num Mac arm64, que trava minutos no
# download/carregamento dos modelos wav2vec2/faster-whisper sob emulacao).
name: Deploy phonetic service

on:
  push:
    branches: [main]
    paths:
      - "services/phonetic-container/**"
      # mesmo achado do deploy-generation-service.yml (Fase 15): mudança em
      # código VENDORIZADO de pipeline/ não disparava redeploy sozinha.
      - "pipeline/src/deutsch_pipeline/**"
      # AI-4.6a: codigo TS compartilhado pelos dois Workers de container
      # (bearer.ts) -- mesmo motivo do path de pipeline/ acima.
      - "services/shared/**"
  workflow_dispatch: {}

# AI-4.6e: token do GitHub so' com leitura (o deploy usa o token da
# Cloudflare, nao o do GitHub); Actions por SHA, versao no comentario.
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Fase 6.2 -- mesmo gate do deploy-generation-service.yml.
    environment: production
    defaults:
      run:
        working-directory: services/phonetic-container
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      # npm ci: instala exatamente o lockfile (wrangler incluso), sem resolver
      # versao nova na hora do deploy
      - run: npm ci

      # docker COPY nao alcanca fora do build context -- vendoriza o
      # minimo necessario de pipeline/ pra dentro deste diretorio antes de
      # buildar (ver prepare-vendor.sh).
      - run: ./prepare-vendor.sh

      - name: Deploy with first valid Cloudflare token
        env:
          # Try both secret names in sequence because one can become stale or
          # lose Containers permissions independently.
          DEPLOY_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN }}
          LEGACY_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail

          try_deploy() {
            local token="$1"
            local label="$2"
            if [ -z "$token" ]; then
              return 1
            fi
            echo "Attempting deploy with ${label}..."
            if CLOUDFLARE_API_TOKEN="$token" npx wrangler deploy; then
              echo "Deploy succeeded with ${label}."
              return 0
            fi
            return 1
          }

          if try_deploy "$DEPLOY_TOKEN" "CLOUDFLARE_DEPLOY_API_TOKEN"; then
            exit 0
          fi

          if try_deploy "$LEGACY_TOKEN" "CLOUDFLARE_API_TOKEN"; then
            exit 0
          fi

          echo "Deploy failed with both configured Cloudflare tokens."
          exit 1

      # Fase 6.3 -- mesmo aviso do deploy-generation-service.yml (ver o
      # comentario la').
      - name: Notify Slack
        if: always()
        continue-on-error: true
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_USERNAME: "🚀 Deploy Bot"
          SLACK_ICON_EMOJI: ":rocket:"
          JOB_STATUS: ${{ job.status }}
          WORKFLOW: ${{ github.workflow }}
          BRANCH: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL ausente -- aviso no Slack pulado."
            exit 0
          fi
          if [ "$JOB_STATUS" = "success" ]; then status="✅ sucesso"; else status="❌ falha ($JOB_STATUS)"; fi
          jq -n \
            --arg text "$WORKFLOW · $BRANCH · $status · <$RUN_URL|ver run>" \
            --arg username "$SLACK_USERNAME" \
            --arg icon_emoji "$SLACK_ICON_EMOJI" \
            '{text: $text, username: $username, icon_emoji: $icon_emoji}' \
          | curl -fsS -X POST -H "Content-Type: application/json" --data @- "$SLACK_WEBHOOK_URL"
