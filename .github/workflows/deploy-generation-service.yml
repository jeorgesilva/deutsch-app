# docs/14/16 -- mesmo padrao de deploy-phonetic-service.yml: builda/sobe o
# Worker de Cloudflare Containers do servico de geracao sob demanda direto
# de um runner ubuntu-latest (amd64 nativo, sem emulacao QEMU -- build local
# num Mac arm64 nao foi possivel verificar nesta sessao por falta de
# daemon Docker disponivel, ver docs/16).
name: Deploy generation service

on:
  push:
    branches: [main]
    paths:
      - "services/generation-container/**"
      # Fase 15, achado real: um bug em pipeline/ (import de nível de módulo
      # que crashava o container no boot, nunca detectado porque o path
      # filter só olhava services/generation-container/**) só foi corrigido
      # de fato depois de um `workflow_dispatch` manual -- o filtro original
      # nunca dispara redeploy quando só o código VENDORIZADO (não o
      # Dockerfile/vendor script em si) muda. Sem isso, um fix em pipeline/
      # fica commitado mas nunca chega no container até alguém lembrar de
      # rodar o workflow manualmente.
      - "pipeline/src/deutsch_pipeline/**"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Fase 6.2 -- gate de aprovacao. So' bloqueia depois de configurar
    # Required reviewers em Settings -> Environments -> production (UI);
    # sem isso o job roda direto, como antes.
    environment: production
    defaults:
      run:
        working-directory: services/generation-container
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      # docker COPY nao alcanca fora do build context -- vendoriza o
      # minimo necessario de pipeline/ pra dentro deste diretorio antes de
      # buildar (ver prepare-vendor.sh).
      - run: ./prepare-vendor.sh

      - name: Deploy with first valid Cloudflare token
        env:
          # Try both secret names in sequence because one can become stale or
          # lose Containers permissions independently.
          DEPLOY_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN }}
          LEGACY_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail

          try_deploy() {
            local token="$1"
            local label="$2"
            if [ -z "$token" ]; then
              return 1
            fi
            echo "Attempting deploy with ${label}..."
            if CLOUDFLARE_API_TOKEN="$token" npx wrangler deploy; then
              echo "Deploy succeeded with ${label}."
              return 0
            fi
            return 1
          }

          if try_deploy "$DEPLOY_TOKEN" "CLOUDFLARE_DEPLOY_API_TOKEN"; then
            exit 0
          fi

          if try_deploy "$LEGACY_TOKEN" "CLOUDFLARE_API_TOKEN"; then
            exit 0
          fi

          echo "Deploy failed with both configured Cloudflare tokens."
          exit 1

      # Fase 6.3 -- aviso no Slack (incoming webhook), sucesso ou falha.
      # continue-on-error: nunca muda o resultado do deploy, nem enquanto o
      # secret nao existir. Tudo entra por env (nunca ${{ }} dentro do
      # script) e o JSON sai do jq, entao aspas no nome da branch nao quebram
      # o payload. SLACK_USERNAME/SLACK_ICON_EMOJI sao reusados pela 6.6.
      - name: Notify Slack
        if: always()
        continue-on-error: true
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_USERNAME: "🚀 Deploy Bot"
          SLACK_ICON_EMOJI: ":rocket:"
          JOB_STATUS: ${{ job.status }}
          WORKFLOW: ${{ github.workflow }}
          BRANCH: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL ausente -- aviso no Slack pulado."
            exit 0
          fi
          if [ "$JOB_STATUS" = "success" ]; then status="✅ sucesso"; else status="❌ falha ($JOB_STATUS)"; fi
          jq -n \
            --arg text "$WORKFLOW · $BRANCH · $status · <$RUN_URL|ver run>" \
            --arg username "$SLACK_USERNAME" \
            --arg icon_emoji "$SLACK_ICON_EMOJI" \
            '{text: $text, username: $username, icon_emoji: $icon_emoji}' \
          | curl -fsS -X POST -H "Content-Type: application/json" --data @- "$SLACK_WEBHOOK_URL"
