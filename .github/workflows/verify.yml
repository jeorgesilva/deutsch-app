# .github/workflows/verify.yml
name: Code Quality, Type Safety & LLMOps Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# AI-4.6e (Tech DD, 18/11/2026): token do GitHub so' com leitura; Actions
# fixadas por SHA (o comentario ao lado e' a versao, que o Dependabot
# atualiza junto -- .github/dependabot.yml); ferramentas com versao exata.
# Runtimes (Node/Python) seguem a linha da versao de proposito, para os
# patches de seguranca chegarem sozinhos.
permissions:
  contents: read

jobs:
  python-and-llmops-audit:
    name: Python Static Audit & LLMOps Prompt Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Source Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python Runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Analysis Dependencies
        # mesma versao do .venv local (vulture 2.16)
        run: |
          pip install vulture==2.16

      - name: Execute Vulture Audit Gate
        run: |
          export PYTHONPATH=$PYTHONPATH:.
          vulture pipeline/ vulture_whitelist.py

      # --- AUTOMATED PROMPT EVALUATION GATE ---
      - name: Set up Node.js Runtime for Promptfoo
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '26.x'

      - name: Run Automated LLMOps Evaluation Sweep
        # versao exata: este passo roda com o HF_TOKEN no ambiente. Residuo:
        # as dependencias do promptfoo ainda sao resolvidas na hora (npx nao
        # tem lockfile).
        run: npx --yes promptfoo@0.125.1 eval --no-cache
        env:
          # Securely binding your Hugging Face Pro token from GitHub Repository Secrets
          HF_TOKEN: ${{ secrets.HF_TOKEN }}

  typescript-edge-audit:
    name: TypeScript Edge API Typecheck & Dependency Hygiene
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Source Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js Runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '26.x'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install Frontend & Worker Dependencies
        run: |
          cd app
          npm ci

      - name: Verify TypeScript Compile Boundaries
        run: |
          cd app
          npx tsc --noEmit

      - name: Inspect Production Dependency Layouts
        run: |
          cd app
          npx --yes depcheck@1.4.7 . --ignores="typescript,vitest,wrangler" || true

