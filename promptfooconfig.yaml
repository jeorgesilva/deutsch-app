description: "AI Alignment Validation - VowelInsertEngine Matrix"

prompts:
  - |
    Create exactly 2 German phonetic minimal pairs for B2/C1 learners focusing on: {{ponto_topico}}. 
    Description: {{ponto_descricao}}. 
    Anchor example: {{ponto_exemplo}}. 
    Output strict JSON array only with fields: palavra_1, palavra_2, frase_1, frase_2.

providers:
  - id: huggingface:chat:deepseek-ai/DeepSeek-V3
    config:
      temperature: 0.4

tests:
  - vars:
      ponto_topico: "Kurze und lange Vokale"
      ponto_descricao: "A duração da vogal muda o significado da palavra — não é só sotaque, é distintivo."
      ponto_exemplo: "Staat [a:] (Estado) vs. Stadt [a] (cidade)"
      n_pairs: 2
    assert:
      - type: contains
        value: "palavra_1"
        description: "Garantia estrutural do campo palavra_1"
      - type: contains
        value: "frase_1"
        description: "Garantia estrutural do campo frase_1"

  - vars:
      ponto_topico: "Umlaute ä, ö, ü"
      ponto_descricao: "Vogais anteriores arredondadas (ö, ü) não existem em português."
      ponto_exemplo: "schön (bonito) vs. schon (já)"
      n_pairs: 2
    assert:
      - type: contains
        value: "palavra_2"
        description: "Garantia estrutural do campo palavra_2"
