# docs/14/16 -- servico de geracao sob demanda em Cloudflare Containers,
# mesmo padrao do phonetic-container (Worker normal, nao Pages Functions --
# Containers exige DO declarada com `main`). enableInternet=true (default do
# pacote) sem allowedHosts/ContainerProxy -- ver src/index.ts pro achado
# completo de por que allowedHosts+ContainerProxy quebrou.
name = "deutsch-generation-service"
compatibility_date = "2026-07-31"
main = "src/index.ts"

# Fase 15 -- 06:00 no fuso do projeto (CEST, UTC+2 em agosto) = 04:00 UTC,
# fuso que o Cloudflare Cron Trigger sempre usa. scheduled() em src/index.ts
# roda o batch diario (10 videos + 10 blocos de leitura). [triggers], igual
# [observability] logo abaixo, e' uma tabela TOML -- precisa vir ANTES de
# qualquer outro campo de nivel raiz que ainda falte (nao ha nenhum depois
# deste ponto no arquivo, entao a ordem aqui e' segura pela mesma regra ja
# documentada abaixo).
[triggers]
crons = ["0 4 * * *"]

# achado (docs/16): [observability] precisa vir DEPOIS de todo campo de
# nivel raiz (main, compatibility_date etc.) -- em TOML, uma vez que
# [observability] abre, TUDO que vem depois pertence a essa tabela ate o
# proximo cabecalho [tabela]. Com `main` escrito DEPOIS de [observability]
# (ordem anterior), wrangler avisava "Unexpected fields found in
# observability field: main" -- main nunca virou chave de nivel raiz de
# verdade, o que pode explicar o proprio crash-loop que motivou adicionar
# observability em primeiro lugar. Sem isso, wrangler tail so' mostra
# excecao JS do Worker, nunca stdout/stderr do processo Python dentro do
# container -- exatamente o que faltava pra diagnosticar "not running"/
# "internal error connecting to the port". Nao mostra stderr da JVM do
# LanguageTool em si (language_tool_python redireciona pra DEVNULL, ver
# validation/harness.py) -- so' o que o proprio waitress/Flask/Python
# imprimir.
[observability]
enabled = true

[[containers]]
class_name = "GenerationContainer"
image = "./Dockerfile"
# Era standard-1 (4 GiB) -- crash-loop ("not running"/"internal error
# connecting to the port" logo apos startAndWaitForPorts ter sucesso,
# docs/16) persistiu mesmo depois de corrigir os 2 bugs de JS (storage de
# DO poluido, ID randomico) e a ordem de campos do wrangler.toml
# (observability engolindo `main`). spaCy de_core_news_lg + JVM do
# LanguageTool (sem -Xmx explicito, autodimensiona pelo cgroup) + Python
# concorrendo em 4GiB e' candidato concreto a OOM-kill silencioso -- bump
# pra standard-2 (1 vCPU/6 GiB) e' o teste empirico mais barato disponivel
# (sem acesso a log do container em si pra confirmar direto).
instance_type = "standard-2"
max_instances = 1

[[durable_objects.bindings]]
name = "GENERATION_CONTAINER"
class_name = "GenerationContainer"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GenerationContainer"]
